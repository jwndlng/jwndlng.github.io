<article class="post-entry project-card">
  <div class="project-card-icon" aria-hidden="true">
    {{- if eq (.Get "icon") "watchman" }}
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18 5h12v8H18zM18 35h12v8H18z" fill="currentColor" opacity=".35"/>
      <rect x="11" y="11" width="26" height="26" rx="8" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="24" cy="24" r="7" stroke="currentColor" stroke-width="2.5"/>
      <path d="M24 19v5l4 2" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    {{- else if eq (.Get "icon") "spec-control" }}
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="m16 15-8 9 8 9M32 15l8 9-8 9M27 11l-6 26" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13 8h22" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    </svg>
    {{- else if eq (.Get "icon") "cert-manager" }}
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 6 38 12v11c0 9-5.8 15.2-14 19-8.2-3.8-14-10-14-19V12L24 6Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="m17 24 5 5 10-11" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    {{- end }}
  </div>
  <div class="project-card-body">
    <header class="entry-header">
      <h3>{{ .Get "title" }}</h3>
    </header>
    <div class="entry-content">{{ .Inner | markdownify }}</div>
    <footer class="entry-footer">
      <a href="{{ .Get "url" }}" target="_blank" rel="noopener noreferrer">View repository <span aria-hidden="true">↗</span></a>
    </footer>
  </div>
</article>
