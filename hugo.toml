baseURL = "https://wndlng.ch"
title = "wndlng"
theme = "PaperMod"
languageCode = "en-us"
paginate = 5

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  mainSections = ["posts"]
  defaultTheme = "light"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  [params.homeInfoParams]
    Title = "Hello!"
  [params.author]
    name = "Jan Wendling"
  [[params.socialIcons]]
    name = "github"
    url = "https://www.github.com/jwndlng"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/jan-wendling/"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 20

[[menu.main]]
  identifier = "projects"
  name = "Projects"
  url = "/projects/"
  weight = 25

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 30

[[menu.main]]
  identifier = "github"
  name = "GitHub"
  url = "https://www.github.com/jwndlng"
  weight = 40

[[menu.main]]
  identifier = "linkedin"
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/jan-wendling/"
  weight = 50

[markup]
  [markup.goldmark.renderer]
    hardWraps = true
  [markup.highlight]
    noClasses = false
    guessSyntax = true
    style = "nord"
